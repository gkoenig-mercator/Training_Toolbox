# Environment used by Binder (mybinder.org).
# When this folder exists, Binder ignores the environment.yml at the repo root.
# JupyterLab and the kernel are provided by Binder itself, so they are not listed here.
# The "-base"/"-core" packages skip GUI and optional extras to keep the build fast.
channels:
  - conda-forge
dependencies:
  - python=3.12
  - copernicusmarine=2.5.0
  # Versions compatible with copernicusmarine 2.5.0, from the Toolbox's dependency list
  # and compatibility notes (https://toolbox-docs.marine.copernicus.eu/en/v2.2.0/installation.html)
  - numpy>=2.1,<3
  - pandas>=2.1,<4
  - xarray>=2025.3.0
  - dask-core>=2024.8.1
  - netcdf4<=1.7.2
  - zarr>=2.18.3,<4
  - matplotlib-base
  - cartopy
  - scipy
